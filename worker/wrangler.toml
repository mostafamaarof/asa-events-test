name = "asa-events-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "asa-events"
database_id = "PUT-YOUR-D1-DATABASE-ID-HERE"

[vars]
ALLOWED_ORIGINS = "https://events.mostafamaarof.com,https://mostafamaarof.github.io,http://localhost:8000"
MAIL_FROM = "ASA Events (test) <events@mostafamaarof.com>"
OTP_TTL_MINUTES = "10"

# Secrets, set with: npx wrangler secret put NAME
#   RESEND_API_KEY   sending key from resend.com
#   SESSION_SECRET   any long random string
#   ADMIN_TOKEN      long random string, used to read the data back
