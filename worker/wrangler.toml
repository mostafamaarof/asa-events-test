name = "asa-events-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "asa-events"
database_id = "173ebad5-1462-486f-b086-11620891dafb"

[[r2_buckets]]
binding = "FILES"
bucket_name = "asa-events-files"

[vars]
ALLOWED_ORIGINS = "https://mostafamaarof.com,https://www.mostafamaarof.com,https://events.mostafamaarof.com,https://mostafamaarof.github.io,http://localhost:8000"
MAIL_FROM = "ASA Events (test) <events@mostafamaarof.com>"
OTP_TTL_MINUTES = "10"
FRONTEND_BASE = "https://mostafamaarof.com/asa-events-test"

# Secrets, set with: npx wrangler secret put NAME
#   RESEND_API_KEY   sending key from resend.com
#   SESSION_SECRET   any long random string
#   ADMIN_TOKEN      long random string, used to read the data back
