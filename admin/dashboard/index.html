<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Leadership Dashboard — ASA Events Admin</title>
<style>
:root{
  --ink:#0B2135; --ink-soft:#1C3A56; --surface:#EEF2F6; --sheet:#FFFFFF;
  --rule:#CBD6E0; --rule-strong:#93A6B8; --muted:#556A7D;
  --brass:#A8842C; --brass-tint:#F3EBD8;
  --ok:#1D6B4C; --ok-tint:#E9F4EE; --err:#A02226; --err-tint:#FAECEC; --warn-tint:#FBF3DF; --warn:#8A6100;
  --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;color:var(--ink);background:var(--surface)}
header{background:var(--ink);color:#fff;padding:16px 24px}
header h1{margin:0;font-size:18px;font-weight:500}
header p{margin:4px 0 0;font-size:13px;color:#A9BDD0}
main{max-width:1100px;margin:0 auto;padding:24px 20px 64px;display:grid;gap:20px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:20px 24px}
.card h2{font-size:16px;margin:0 0 4px}
.card .cap{font-size:13px;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px}
label{font-size:13px;font-weight:500}
input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:2px;border:1px solid transparent;background:var(--ink);color:#fff;cursor:pointer}
button:hover{background:var(--ink-soft)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
button.ghost:hover{background:#F1F5F8}
.msg{font-size:13px;padding:10px 12px;border-radius:2px;display:none}
.msg.ok{display:block;background:var(--ok-tint);color:var(--ok)}
.msg.err{display:block;background:var(--err-tint);color:var(--err)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* KPI row -- figures only, no charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.kpi{background:var(--sheet);padding:16px 18px}
.kpi .v{font-family:var(--f-body);font-size:28px;font-weight:600;color:var(--ink);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:6px}

/* Cross-tab tables */
.tblwrap{overflow-x:auto;border:1px solid var(--rule)}
table.datatable{border-collapse:collapse;width:100%;font-size:13px}
table.datatable th,table.datatable td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.datatable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:#FAFCFD;position:sticky;top:0}
table.datatable td.n,table.datatable th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.datatable td.wrap{white-space:normal}
table.datatable tr.totalrow td{font-weight:600;background:#FAFCFD;border-top:2px solid var(--ink)}
table.datatable tr:last-child td{border-bottom:none}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:720px){.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>ASA Events — Leadership Dashboard</h1>
  <p>Internal tool. Not linked from the public site. Requires an access token.</p>
</header>

<main>
  <div class="card">
    <h2>Access token</h2>
    <div class="grid">
      <div class="f" style="grid-column:1/-1">
        <label for="token">Access token <span style="color:var(--brass)">*</span></label>
        <input type="password" id="token" autocomplete="off" placeholder="paste your token">
        <span class="hint">Kept only in this browser tab (sessionStorage). Same token as the Full Report page.</span>
      </div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="load">Load dashboard</button>
      <span id="topMsg" class="msg"></span>
    </div>
  </div>

  <div id="content"></div>
</main>

<script>
const CONFIG = { apiBase: 'https://asa-events-api.mostafamaarof.workers.dev/v1' };
const $ = (id) => document.getElementById(id);
const tokenInput = $('token');
tokenInput.value = sessionStorage.getItem('asa_report_token') || '';
tokenInput.addEventListener('input', () => sessionStorage.setItem('asa_report_token', tokenInput.value));

function showMsg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
function authHeaders() {
  const token = tokenInput.value.trim();
  if (!token) throw new Error('Enter the access token first.');
  return { 'Authorization': 'Bearer ' + token };
}

const EVENT_NAMES = { 'WGITA-35-2026': '35th Annual Meeting of INTOSAI Working Group on IT Audit', 'KSC-SC18-2026': '18th KSC Steering Committee Meeting' };
const ROLE_NAMES = { hod:'Head of delegation', delegate:'Delegate', observer:'Observer', speaker:'Speaker', moderator:'Moderator', secretariat:'Secretariat', interpreter:'Interpreter', accompanying:'Accompanying official' };
const DIET_NAMES = { none:'No special requirement', vegetarian:'Vegetarian', vegan:'Vegan', halal:'Halal only', gluten:'Gluten free', diabetic:'Diabetic', other:'Other' };
const TIER_NAMES = { president: 'President', vice_president: 'Vice President', other: 'Other' };
const COUNTRIES_RAW = "AF:Afghanistan|AL:Albania|DZ:Algeria|AS:American Samoa|AD:Andorra|AO:Angola|AI:Anguilla|AQ:Antarctica|AG:Antigua and Barbuda|AR:Argentina|AM:Armenia|AW:Aruba|AU:Australia|AT:Austria|AZ:Azerbaijan|BS:Bahamas|BH:Bahrain|BD:Bangladesh|BB:Barbados|BY:Belarus|BE:Belgium|BZ:Belize|BJ:Benin|BM:Bermuda|BT:Bhutan|BO:Bolivia|BQ:Bonaire, Sint Eustatius and Saba|BA:Bosnia and Herzegovina|BW:Botswana|BV:Bouvet Island|BR:Brazil|IO:British Indian Ocean Territory|BN:Brunei Darussalam|BG:Bulgaria|BF:Burkina Faso|BI:Burundi|CV:Cabo Verde|KH:Cambodia|CM:Cameroon|CA:Canada|KY:Cayman Islands|CF:Central African Republic|TD:Chad|CL:Chile|CN:China|CX:Christmas Island|CC:Cocos (Keeling) Islands|CO:Colombia|KM:Comoros|CG:Congo|CD:Congo, The Democratic Republic of the|CK:Cook Islands|CR:Costa Rica|HR:Croatia|CU:Cuba|CW:Curaçao|CY:Cyprus|CZ:Czechia|CI:Côte d'Ivoire|DK:Denmark|DJ:Djibouti|DM:Dominica|DO:Dominican Republic|EC:Ecuador|EG:Egypt|SV:El Salvador|GQ:Equatorial Guinea|ER:Eritrea|EE:Estonia|SZ:Eswatini|ET:Ethiopia|FK:Falkland Islands (Malvinas)|FO:Faroe Islands|FJ:Fiji|FI:Finland|FR:France|GF:French Guiana|PF:French Polynesia|TF:French Southern Territories|GA:Gabon|GM:Gambia|GE:Georgia|DE:Germany|GH:Ghana|GI:Gibraltar|GR:Greece|GL:Greenland|GD:Grenada|GP:Guadeloupe|GU:Guam|GT:Guatemala|GG:Guernsey|GN:Guinea|GW:Guinea-Bissau|GY:Guyana|HT:Haiti|HM:Heard Island and McDonald Islands|VA:Holy See (Vatican City State)|HN:Honduras|HK:Hong Kong|HU:Hungary|IS:Iceland|IN:India|ID:Indonesia|IR:Iran|IQ:Iraq|IE:Ireland|IM:Isle of Man|IL:Israel|IT:Italy|JM:Jamaica|JP:Japan|JE:Jersey|JO:Jordan|KZ:Kazakhstan|KE:Kenya|KI:Kiribati|KP:North Korea|KR:South Korea|KW:Kuwait|KG:Kyrgyzstan|LA:Laos|LV:Latvia|LB:Lebanon|LS:Lesotho|LR:Liberia|LY:Libya|LI:Liechtenstein|LT:Lithuania|LU:Luxembourg|MO:Macao|MG:Madagascar|MW:Malawi|MY:Malaysia|MV:Maldives|ML:Mali|MT:Malta|MH:Marshall Islands|MQ:Martinique|MR:Mauritania|MU:Mauritius|YT:Mayotte|MX:Mexico|FM:Micronesia, Federated States of|MD:Moldova|MC:Monaco|MN:Mongolia|ME:Montenegro|MS:Montserrat|MA:Morocco|MZ:Mozambique|MM:Myanmar|NA:Namibia|NR:Nauru|NP:Nepal|NL:Netherlands|NC:New Caledonia|NZ:New Zealand|NI:Nicaragua|NE:Niger|NG:Nigeria|NU:Niue|NF:Norfolk Island|MK:North Macedonia|MP:Northern Mariana Islands|NO:Norway|OM:Oman|PK:Pakistan|PW:Palau|PS:Palestine, State of|PA:Panama|PG:Papua New Guinea|PY:Paraguay|PE:Peru|PH:Philippines|PN:Pitcairn|PL:Poland|PT:Portugal|PR:Puerto Rico|QA:Qatar|RO:Romania|RU:Russian Federation|RW:Rwanda|RE:Réunion|BL:Saint Barthélemy|SH:Saint Helena, Ascension and Tristan da Cunha|KN:Saint Kitts and Nevis|LC:Saint Lucia|MF:Saint Martin (French part)|PM:Saint Pierre and Miquelon|VC:Saint Vincent and the Grenadines|WS:Samoa|SM:San Marino|ST:Sao Tome and Principe|SA:Saudi Arabia|SN:Senegal|RS:Serbia|SC:Seychelles|SL:Sierra Leone|SG:Singapore|SX:Sint Maarten (Dutch part)|SK:Slovakia|SI:Slovenia|SB:Solomon Islands|SO:Somalia|ZA:South Africa|GS:South Georgia and the South Sandwich Islands|SS:South Sudan|ES:Spain|LK:Sri Lanka|SD:Sudan|SR:Suriname|SJ:Svalbard and Jan Mayen|SE:Sweden|CH:Switzerland|SY:Syria|TW:Taiwan|TJ:Tajikistan|TZ:Tanzania|TH:Thailand|TL:Timor-Leste|TG:Togo|TK:Tokelau|TO:Tonga|TT:Trinidad and Tobago|TN:Tunisia|TM:Turkmenistan|TC:Turks and Caicos Islands|TV:Tuvalu|TR:Türkiye|UG:Uganda|UA:Ukraine|AE:United Arab Emirates|GB:United Kingdom|US:United States|UM:United States Minor Outlying Islands|UY:Uruguay|UZ:Uzbekistan|VU:Vanuatu|VE:Venezuela|VN:Vietnam|VG:Virgin Islands, British|VI:Virgin Islands, U.S.|WF:Wallis and Futuna|EH:Western Sahara|YE:Yemen|ZM:Zambia|ZW:Zimbabwe|AX:Åland Islands";
const COUNTRY_NAMES = Object.fromEntries(COUNTRIES_RAW.split('|').map(s => { const i = s.indexOf(':'); return [s.slice(0,i), s.slice(i+1)]; }));

/* Which event(s) a registration covers -- module scope since both the KPI
   maths and the per-category breakdowns need it. */
const events = (r) => (r.event_codes || '').split(',').filter(Boolean);

function kpiTile(value, label) {
  return `<div class="kpi"><div class="v">${value}</div><div class="l">${label}</div></div>`;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* Every category (role, country, organisation, job title, hotel, diet...)
   broken down by which event(s) each person is attending. No folding into
   "Other" -- every distinct value gets its own row. */
function groupCountByEvent(rows, keyFn, nameMap) {
  const counts = {};
  rows.forEach(r => {
    const raw = keyFn(r);
    const vals = Array.isArray(raw) ? raw : [raw];
    const e = events(r);
    const bucket = e.length > 1 ? 'both' : e[0] === 'WGITA-35-2026' ? 'wgita' : e[0] === 'KSC-SC18-2026' ? 'ksc' : null;
    if (!bucket) return;
    vals.forEach(v => {
      if (!v) return;
      const label = (nameMap && nameMap[v]) || v;
      if (!counts[label]) counts[label] = { label, wgita: 0, ksc: 0, both: 0 };
      counts[label][bucket]++;
    });
  });
  return Object.values(counts);
}
/* Same idea, broken down by protocol tier instead of event. */
function groupCountByTier(rows, keyFn, nameMap) {
  const counts = {};
  rows.forEach(r => {
    const raw = keyFn(r);
    const vals = Array.isArray(raw) ? raw : [raw];
    const tier = r.participant_tier || 'other';
    vals.forEach(v => {
      if (!v) return;
      const label = (nameMap && nameMap[v]) || v;
      if (!counts[label]) counts[label] = { label, president: 0, vice_president: 0, other: 0 };
      counts[label][tier]++;
    });
  });
  return Object.values(counts);
}

/* A plain rows-x-columns table: one row per category value, one column per
   series (event or tier), a Total column per row and a Total row per column
   -- the whole dashboard is figures and tables only, no charts. Sorted
   alphabetically by row label so a specific country/organisation/hotel can
   be found by scanning, not by picking it out of a ranked list. */
function crossTable(groupRows, columns, rowHeader) {
  if (!groupRows.length) return '<p class="empty">No data.</p>';
  const sorted = groupRows.slice().sort((a, b) => a.label.localeCompare(b.label));
  const colTotals = Object.fromEntries(columns.map(c => [c.key, 0]));
  let grandTotal = 0;
  const bodyRows = sorted.map(g => {
    const rowTotal = columns.reduce((s, c) => s + (g[c.key] || 0), 0);
    columns.forEach(c => { colTotals[c.key] += (g[c.key] || 0); });
    grandTotal += rowTotal;
    return `<tr><td class="wrap">${esc(g.label)}</td>${columns.map(c => `<td class="n">${g[c.key] || 0}</td>`).join('')}<td class="n">${rowTotal}</td></tr>`;
  }).join('');
  const totalRow = `<tr class="totalrow"><td>Total</td>${columns.map(c => `<td class="n">${colTotals[c.key]}</td>`).join('')}<td class="n">${grandTotal}</td></tr>`;
  return `<div class="tblwrap"><table class="datatable">
    <thead><tr><th>${rowHeader}</th>${columns.map(c => `<th class="n">${c.label}</th>`).join('')}<th class="n">Total</th></tr></thead>
    <tbody>${bodyRows}${totalRow}</tbody>
  </table></div>`;
}

const EVENT_COLS = [{ key: 'wgita', label: 'WGITA' }, { key: 'ksc', label: 'KSC' }, { key: 'both', label: 'Both' }];
const TIER_COLS = [{ key: 'president', label: 'President' }, { key: 'vice_president', label: 'Vice President' }, { key: 'other', label: 'Other' }];

async function loadDashboard() {
  const msg = $('topMsg'); msg.className = 'msg';
  try {
    const res = await fetch(CONFIG.apiBase + '/admin/export.json', { headers: authHeaders() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    const rows = (data.registrations || []).filter(r => r.status === 'approved');
    showMsg(msg, `Loaded ${rows.length} approved registration(s).`, true);
    renderDashboard(rows);
  } catch (e) {
    showMsg(msg, e.message, false);
  }
}

function renderDashboard(rows) {
  const content = $('content');
  if (!rows.length) { content.innerHTML = '<p class="empty">No approved registrations yet.</p>'; return; }

  const dset = (r) => (r.data || {});
  const hotelName = (r) => {
    const d = dset(r);
    if (d.accommodation_type === 'official') return d.official_hotel || '(official hotel — name not given)';
    if (d.accommodation_type === 'own') return d.own_hotel_name_address || '(own arrangement — address not given)';
    return 'Not yet decided';
  };
  const bothCount = rows.filter(r => events(r).length > 1).length;
  const wgitaOnly = rows.filter(r => { const e = events(r); return e.length === 1 && e[0] === 'WGITA-35-2026'; }).length;
  const kscOnly = rows.filter(r => { const e = events(r); return e.length === 1 && e[0] === 'KSC-SC18-2026'; }).length;
  const countries = new Set(rows.map(r => r.country).filter(Boolean));
  const orgs = new Set(rows.map(r => r.organization_name).filter(Boolean));
  const speaking = rows.filter(r => dset(r).wants_to_present === 'yes').length;
  const visa = rows.filter(r => r.visa_letter_needed).length;
  const social = rows.filter(r => dset(r).social_program_attending === 'yes').length;
  const official = rows.filter(r => dset(r).accommodation_type === 'official').length;
  const own = rows.filter(r => dset(r).accommodation_type === 'own').length;
  const presidents = rows.filter(r => r.participant_tier === 'president').length;
  const vicePresidents = rows.filter(r => r.participant_tier === 'vice_president').length;

  const byRole = groupCountByEvent(rows, r => r.role_in_delegation, ROLE_NAMES);
  const byTierEvent = groupCountByEvent(rows, r => r.participant_tier || 'other', TIER_NAMES);
  const byCountry = groupCountByEvent(rows, r => r.country, COUNTRY_NAMES);
  const byOrgEvent = groupCountByEvent(rows, r => r.organization_name);
  const byOrgTier = groupCountByTier(rows, r => r.organization_name);
  const byJobTitle = groupCountByEvent(rows, r => (dset(r).job_title || '').trim());
  const byDiet = groupCountByEvent(rows, r => dset(r).dietary_requirements, DIET_NAMES);
  const byHotelEvent = groupCountByEvent(rows, hotelName);
  const byHotelTier = groupCountByTier(rows, hotelName);

  content.innerHTML = `
    <div class="card">
      <h2>At a glance</h2>
      <p class="cap">Confirmed (approved) registrations only.</p>
      <div class="kpis">
        ${kpiTile(rows.length, 'Total confirmed registrations')}
        ${kpiTile(countries.size, 'Countries represented')}
        ${kpiTile(orgs.size, 'Organisations represented')}
        ${kpiTile(presidents, 'Presidents attending')}
        ${kpiTile(vicePresidents, 'Vice Presidents attending')}
        ${kpiTile(speaking, 'Requesting to speak')}
        ${kpiTile(visa, 'Need a visa facilitation letter')}
        ${kpiTile(social, 'Joining the social programme')}
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <h2>Registrations by event</h2>
        <p class="cap">One person attending both events is counted once, under "Both".</p>
        <div class="tblwrap"><table class="datatable">
          <thead><tr><th>Event</th><th class="n">Count</th></tr></thead>
          <tbody>
            <tr><td>WGITA only</td><td class="n">${wgitaOnly}</td></tr>
            <tr><td>KSC only</td><td class="n">${kscOnly}</td></tr>
            <tr><td>Both</td><td class="n">${bothCount}</td></tr>
            <tr class="totalrow"><td>Total</td><td class="n">${wgitaOnly + kscOnly + bothCount}</td></tr>
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>Accommodation</h2>
        <p class="cap">Where confirmed participants are staying.</p>
        <div class="kpis" style="grid-template-columns:1fr 1fr">
          ${kpiTile(official, 'Official hotel')}
          ${kpiTile(own, 'Own arrangement')}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Protocol tier by event</h2>
      <p class="cap">President / Vice President / Other. Set on the Registrations page.</p>
      ${crossTable(byTierEvent, EVENT_COLS, 'Tier')}
    </div>

    <div class="card">
      <h2>Role in the delegation, by event</h2>
      <p class="cap">Confirmed participants by protocol role.</p>
      ${crossTable(byRole, EVENT_COLS, 'Role')}
    </div>

    <div class="card">
      <h2>All countries, by event</h2>
      <p class="cap">Every country represented.</p>
      ${crossTable(byCountry, EVENT_COLS, 'Country')}
    </div>

    <div class="card">
      <h2>All organisations, by event</h2>
      <p class="cap">Every SAI/organisation represented.</p>
      ${crossTable(byOrgEvent, EVENT_COLS, 'Organisation')}
    </div>

    <div class="card">
      <h2>All organisations, by protocol tier</h2>
      <p class="cap">Which organisations the President/Vice President attendees belong to.</p>
      ${crossTable(byOrgTier, TIER_COLS, 'Organisation')}
    </div>

    <div class="card">
      <h2>Job title, by event</h2>
      <p class="cap">Confirmed participants by job title.</p>
      ${crossTable(byJobTitle, EVENT_COLS, 'Job title')}
    </div>

    <div class="card">
      <h2>Dietary requirements, by event</h2>
      <p class="cap">For catering planning.</p>
      ${crossTable(byDiet, EVENT_COLS, 'Requirement')}
    </div>

    <div class="card">
      <h2>Hotels, by event</h2>
      <p class="cap">Where each event's participants are staying, including own arrangements.</p>
      ${crossTable(byHotelEvent, EVENT_COLS, 'Hotel')}
    </div>

    <div class="card">
      <h2>Hotels, by protocol tier</h2>
      <p class="cap">Which hotels the President/Vice President attendees are staying at.</p>
      ${crossTable(byHotelTier, TIER_COLS, 'Hotel')}
    </div>
  `;
}

$('load').addEventListener('click', loadDashboard);
if (tokenInput.value) loadDashboard();
</script>
</body>
</html>
