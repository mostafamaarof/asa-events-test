<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Logistics Reports — ASA Events Admin</title>
<style>
:root{
  --ink:#0B2135; --ink-soft:#1C3A56; --surface:#EEF2F6; --sheet:#FFFFFF;
  --rule:#CBD6E0; --rule-strong:#93A6B8; --muted:#556A7D;
  --brass:#A8842C; --brass-tint:#F3EBD8;
  --ok:#1D6B4C; --ok-tint:#E9F4EE; --err:#A02226; --err-tint:#FAECEC; --warn-tint:#FBF3DF; --warn:#8A6100;
  --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:ui-monospace,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;color:var(--ink);background:var(--surface)}
header{background:var(--ink);color:#fff;padding:16px 24px}
header h1{margin:0;font-size:18px;font-weight:500}
header p{margin:4px 0 0;font-size:13px;color:#A9BDD0}
main{max-width:1200px;margin:0 auto;padding:24px 20px 64px;display:grid;gap:20px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:20px 24px}
.card h2{font-size:16px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px}
label{font-size:13px;font-weight:500}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;padding:10px 20px;border-radius:2px;border:1px solid transparent;background:var(--ink);color:#fff;cursor:pointer}
button:hover{background:var(--ink-soft)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
button.ghost:hover{background:#F1F5F8}
.msg{font-size:13px;padding:10px 12px;border-radius:2px;display:none}
.msg.ok{display:block;background:var(--ok-tint);color:var(--ok)}
.msg.err{display:block;background:var(--err-tint);color:var(--err)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.filters .f{min-width:180px}
.count{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);margin-top:16px}
.tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-bottom:none;cursor:pointer}
.tab.active{color:var(--ink);background:var(--sheet);border-color:var(--ink);border-bottom:2px solid var(--sheet);margin-bottom:-2px}

.group{background:var(--sheet);border:1px solid var(--rule);break-inside:avoid;page-break-inside:avoid}
.ghead{padding:12px 18px;border-bottom:2px solid var(--ink);background:var(--brass-tint);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ghead .t{font-family:Georgia,serif;font-size:16px;font-weight:600}
.ghead .n{font-size:12.5px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:#FAFCFD;position:sticky;top:0}
td.wrap{white-space:normal}
tr:last-child td{border-bottom:none}
td.ref{font-family:var(--f-num);font-size:12px;color:var(--muted)}
td.muted{color:var(--rule-strong)}

@media print{
  header, .card.controls, .tabs .tab:not(.active){display:none}
  body{background:#fff}
  main{max-width:none;padding:0}
  .group{border:1px solid #000;margin-bottom:16px}
}
</style>
</head>
<body>

<header>
  <h1>ASA Events — Logistics Reports</h1>
  <p>Internal tool. Not linked from the public site. Requires an access token.</p>
</header>

<main>
  <div class="card controls">
    <h2>Access token</h2>
    <div class="grid">
      <div class="f" style="grid-column:1/-1">
        <label for="token">Access token <span style="color:var(--brass)">*</span></label>
        <input type="password" id="token" autocomplete="off" placeholder="paste your token">
        <span class="hint">Kept only in this browser tab (sessionStorage). Same token as the Full Report page.</span>
      </div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="load">Load reports</button>
      <button class="ghost" id="printBtn">Print / Save as PDF</button>
      <button class="ghost" id="csvBtn">Export this report to Excel</button>
      <span id="topMsg" class="msg"></span>
    </div>
    <div class="filters" style="margin-top:16px;margin-bottom:0">
      <div class="f">
        <label for="fEvent">Event</label>
        <select id="fEvent">
          <option value="">All events</option>
          <option value="WGITA-35-2026">35th Annual Meeting of INTOSAI Working Group on IT Audit</option>
          <option value="KSC-SC18-2026">18th KSC Steering Committee Meeting</option>
        </select>
      </div>
      <div class="f">
        <label for="fTier">Tier</label>
        <select id="fTier">
          <option value="">All tiers</option>
          <option value="president">President</option>
          <option value="vice_president">Vice President</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="f" style="flex:1;min-width:220px">
        <label for="fSearch">Search (name, organization, hotel)</label>
        <input type="text" id="fSearch" placeholder="type to filter...">
      </div>
      <span class="count" id="rowCount"></span>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="arrival">By arrival date</div>
      <div class="tab" data-tab="departure">By departure date</div>
      <div class="tab" data-tab="hotel">By hotel</div>
      <div class="tab" data-tab="passport">Passport report</div>
    </div>
  </div>

  <div id="list"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CONFIG = { apiBase: 'https://asa-events-api.mostafamaarof.workers.dev/v1' };
const $ = (id) => document.getElementById(id);
const tokenInput = $('token');
tokenInput.value = sessionStorage.getItem('asa_report_token') || '';
tokenInput.addEventListener('input', () => sessionStorage.setItem('asa_report_token', tokenInput.value));

function showMsg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
function authHeaders() {
  const token = tokenInput.value.trim();
  if (!token) throw new Error('Enter the access token first.');
  return { 'Authorization': 'Bearer ' + token };
}

const O = (pairs) => Object.fromEntries(pairs);
const OPT = {
  delRole: O([['hod','Head of delegation'],['delegate','Delegate'],['observer','Observer'],['speaker','Speaker'],
    ['moderator','Moderator'],['secretariat','Secretariat'],['interpreter','Interpreter'],['accompanying','Accompanying official']]),
  terminal: O([['T1','Terminal 1'],['T2','Terminal 2'],['T3','Terminal 3'],['unknown','Not known yet']]),
  roomType: O([['single','Single'],['double','Double'],['suite','Suite']]),
  tier: O([['president','President'],['vice_president','Vice President'],['other','Other']]),
  passportType: O([['diplomatic','Diplomatic'],['service','Service or special'],['ordinary','Ordinary'],['lp','UN laissez-passer']])
};
const COUNTRIES_RAW = "AF:Afghanistan|AL:Albania|DZ:Algeria|AS:American Samoa|AD:Andorra|AO:Angola|AI:Anguilla|AQ:Antarctica|AG:Antigua and Barbuda|AR:Argentina|AM:Armenia|AW:Aruba|AU:Australia|AT:Austria|AZ:Azerbaijan|BS:Bahamas|BH:Bahrain|BD:Bangladesh|BB:Barbados|BY:Belarus|BE:Belgium|BZ:Belize|BJ:Benin|BM:Bermuda|BT:Bhutan|BO:Bolivia|BQ:Bonaire, Sint Eustatius and Saba|BA:Bosnia and Herzegovina|BW:Botswana|BV:Bouvet Island|BR:Brazil|IO:British Indian Ocean Territory|BN:Brunei Darussalam|BG:Bulgaria|BF:Burkina Faso|BI:Burundi|CV:Cabo Verde|KH:Cambodia|CM:Cameroon|CA:Canada|KY:Cayman Islands|CF:Central African Republic|TD:Chad|CL:Chile|CN:China|CX:Christmas Island|CC:Cocos (Keeling) Islands|CO:Colombia|KM:Comoros|CG:Congo|CD:Congo, The Democratic Republic of the|CK:Cook Islands|CR:Costa Rica|HR:Croatia|CU:Cuba|CW:Curaçao|CY:Cyprus|CZ:Czechia|CI:Côte d'Ivoire|DK:Denmark|DJ:Djibouti|DM:Dominica|DO:Dominican Republic|EC:Ecuador|EG:Egypt|SV:El Salvador|GQ:Equatorial Guinea|ER:Eritrea|EE:Estonia|SZ:Eswatini|ET:Ethiopia|FK:Falkland Islands (Malvinas)|FO:Faroe Islands|FJ:Fiji|FI:Finland|FR:France|GF:French Guiana|PF:French Polynesia|TF:French Southern Territories|GA:Gabon|GM:Gambia|GE:Georgia|DE:Germany|GH:Ghana|GI:Gibraltar|GR:Greece|GL:Greenland|GD:Grenada|GP:Guadeloupe|GU:Guam|GT:Guatemala|GG:Guernsey|GN:Guinea|GW:Guinea-Bissau|GY:Guyana|HT:Haiti|HM:Heard Island and McDonald Islands|VA:Holy See (Vatican City State)|HN:Honduras|HK:Hong Kong|HU:Hungary|IS:Iceland|IN:India|ID:Indonesia|IR:Iran|IQ:Iraq|IE:Ireland|IM:Isle of Man|IL:Israel|IT:Italy|JM:Jamaica|JP:Japan|JE:Jersey|JO:Jordan|KZ:Kazakhstan|KE:Kenya|KI:Kiribati|KP:North Korea|KR:South Korea|KW:Kuwait|KG:Kyrgyzstan|LA:Laos|LV:Latvia|LB:Lebanon|LS:Lesotho|LR:Liberia|LY:Libya|LI:Liechtenstein|LT:Lithuania|LU:Luxembourg|MO:Macao|MG:Madagascar|MW:Malawi|MY:Malaysia|MV:Maldives|ML:Mali|MT:Malta|MH:Marshall Islands|MQ:Martinique|MR:Mauritania|MU:Mauritius|YT:Mayotte|MX:Mexico|FM:Micronesia, Federated States of|MD:Moldova|MC:Monaco|MN:Mongolia|ME:Montenegro|MS:Montserrat|MA:Morocco|MZ:Mozambique|MM:Myanmar|NA:Namibia|NR:Nauru|NP:Nepal|NL:Netherlands|NC:New Caledonia|NZ:New Zealand|NI:Nicaragua|NE:Niger|NG:Nigeria|NU:Niue|NF:Norfolk Island|MK:North Macedonia|MP:Northern Mariana Islands|NO:Norway|OM:Oman|PK:Pakistan|PW:Palau|PS:Palestine, State of|PA:Panama|PG:Papua New Guinea|PY:Paraguay|PE:Peru|PH:Philippines|PN:Pitcairn|PL:Poland|PT:Portugal|PR:Puerto Rico|QA:Qatar|RO:Romania|RU:Russian Federation|RW:Rwanda|RE:Réunion|BL:Saint Barthélemy|SH:Saint Helena, Ascension and Tristan da Cunha|KN:Saint Kitts and Nevis|LC:Saint Lucia|MF:Saint Martin (French part)|PM:Saint Pierre and Miquelon|VC:Saint Vincent and the Grenadines|WS:Samoa|SM:San Marino|ST:Sao Tome and Principe|SA:Saudi Arabia|SN:Senegal|RS:Serbia|SC:Seychelles|SL:Sierra Leone|SG:Singapore|SX:Sint Maarten (Dutch part)|SK:Slovakia|SI:Slovenia|SB:Solomon Islands|SO:Somalia|ZA:South Africa|GS:South Georgia and the South Sandwich Islands|SS:South Sudan|ES:Spain|LK:Sri Lanka|SD:Sudan|SR:Suriname|SJ:Svalbard and Jan Mayen|SE:Sweden|CH:Switzerland|SY:Syria|TW:Taiwan|TJ:Tajikistan|TZ:Tanzania|TH:Thailand|TL:Timor-Leste|TG:Togo|TK:Tokelau|TO:Tonga|TT:Trinidad and Tobago|TN:Tunisia|TM:Turkmenistan|TC:Turks and Caicos Islands|TV:Tuvalu|TR:Türkiye|UG:Uganda|UA:Ukraine|AE:United Arab Emirates|GB:United Kingdom|US:United States|UM:United States Minor Outlying Islands|UY:Uruguay|UZ:Uzbekistan|VU:Vanuatu|VE:Venezuela|VN:Vietnam|VG:Virgin Islands, British|VI:Virgin Islands, U.S.|WF:Wallis and Futuna|EH:Western Sahara|YE:Yemen|ZM:Zambia|ZW:Zimbabwe|AX:Åland Islands";
OPT.country = O(COUNTRIES_RAW.split('|').map(s => { const i = s.indexOf(':'); return [s.slice(0,i), s.slice(i+1)]; }));
const EVENT_NAMES = { 'WGITA-35-2026': '35th Annual Meeting of INTOSAI Working Group on IT Audit', 'KSC-SC18-2026': '18th KSC Steering Committee Meeting' };

let all = [];
let activeTab = 'arrival';

async function loadReports() {
  const msg = $('topMsg'); msg.className = 'msg';
  try {
    const res = await fetch(CONFIG.apiBase + '/admin/export.json', { headers: authHeaders() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    all = (data.registrations || []).filter(r => r.status === 'approved');
    showMsg(msg, `Loaded ${all.length} approved registration(s).`, true);
    render();
  } catch (e) {
    showMsg(msg, e.message, false);
  }
}

/* One computed row per registration, with every field either report might need. */
function computeRows() {
  const evFilter = $('fEvent').value;
  const tierFilter = $('fTier').value;
  const search = $('fSearch').value.trim().toLowerCase();
  return all
    .filter(r => !evFilter || (r.event_codes || '').split(',').includes(evFilter))
    .filter(r => !tierFilter || (r.participant_tier || 'other') === tierFilter)
    .map(r => {
      const d = r.data || {};
      const accCount = (d.is_accompanied === 'yes' && Array.isArray(d.accompanying)) ? d.accompanying.length : 0;
      const hotelName = d.accommodation_type === 'official' ? (d.official_hotel || '(official hotel — name not given)')
        : d.accommodation_type === 'own' ? (d.own_hotel_name_address || '(own arrangement — address not given)')
        : '';
      return {
        ref: r.reference,
        name: r.full_name || '(no name)',
        org: r.organization_name || '',
        country: OPT.country[r.country] || r.country || '',
        role: OPT.delRole[r.role_in_delegation] || r.role_in_delegation || '',
        tier: OPT.tier[r.participant_tier || 'other'] || 'Other',
        events: (r.event_codes || '').split(',').filter(Boolean).map(c => EVENT_NAMES[c] || c).join(' & '),
        mobile: d.mobile || '',
        pax: 1 + accCount,
        arrDate: d.arrival_date || '', arrTime: d.arrival_time || '',
        arrAirline: d.arrival_airline || '', arrFlight: d.arrival_flight_no || '',
        arrTerminal: OPT.terminal[d.arrival_terminal] || d.arrival_terminal || '',
        connecting: d.has_connecting_flight ? [d.connecting_airline, d.connecting_flight_no].filter(Boolean).join(' ') || 'Yes' : '',
        depDate: d.departure_date || '', depTime: d.departure_time || '',
        depAirline: d.departure_airline || '', depFlight: d.departure_flight_no || '',
        depTerminal: OPT.terminal[d.departure_terminal] || d.departure_terminal || '',
        accomType: d.accommodation_type || '', hotelName,
        roomType: OPT.roomType[d.room_type] || d.room_type || '',
        checkIn: d.check_in_date || '', checkOut: d.check_out_date || '',
        bookingRef: d.booking_reference || '',
        passportNumber: d.passport_number || '',
        passportType: OPT.passportType[d.passport_type] || d.passport_type || '',
        passportPlaceOfIssue: d.passport_place_of_issue || '',
        passportIssueDate: d.passport_issue_date || '',
        passportExpiryDate: d.passport_expiry_date || '',
        passportCopyKey: d.passport_copy_key || '',
        passportCopyFilename: d.passport_copy_filename || ''
      };
    })
    .filter(row => !search ||
      row.name.toLowerCase().includes(search) ||
      row.org.toLowerCase().includes(search) ||
      row.hotelName.toLowerCase().includes(search));
}

function fmtDate(iso) {
  if (!iso) return '';
  const dt = new Date(iso + 'T00:00:00');
  if (isNaN(dt)) return iso;
  return dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function td(v, cls) { const c = v ? '' : ' muted'; return `<td class="${(cls||'') + c}">${v ? esc(v) : '—'}</td>`; }

function groupBy(rows, keyFn) {
  const map = new Map();
  rows.forEach(row => {
    const key = keyFn(row);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  });
  return map;
}

/* ---------- Arrival / departure reports: one date-keyed group per day ---------- */
function dateReport(rows, which) {
  const dateKey = which === 'arrival' ? 'arrDate' : 'depDate';
  const timeKey = which === 'arrival' ? 'arrTime' : 'depTime';
  const groups = groupBy(rows, r => r[dateKey] || '￿'); // undated sorts last
  const keys = [...groups.keys()].sort();
  const cols = which === 'arrival'
    ? ['Name','Tier','Org / Country','Role','Event(s)','Mobile','Pax','Arrival time','Airline / Flight','Terminal','Connecting','Hotel','Check-in','Ref']
    : ['Name','Tier','Org / Country','Role','Event(s)','Mobile','Pax','Departure time','Airline / Flight','Terminal','Hotel','Check-out','Ref'];
  return keys.map(key => {
    const items = groups.get(key).slice().sort((a, b) => (a[timeKey] || '').localeCompare(b[timeKey] || ''));
    const title = key === '￿' ? `${which === 'arrival' ? 'Arrival' : 'Departure'} date not yet provided` : fmtDate(key);
    const rowsHtml = items.map(r => {
      if (which === 'arrival') return `<tr>
        <td class="wrap">${esc(r.name)}</td>${td(r.tier)}${td(r.org ? r.org + (r.country ? ' · ' + r.country : '') : r.country, 'wrap')}
        ${td(r.role)}${td(r.events, 'wrap')}${td(r.mobile)}<td>${r.pax}</td>
        ${td(r.arrTime)}${td([r.arrAirline, r.arrFlight].filter(Boolean).join(' '))}${td(r.arrTerminal)}${td(r.connecting)}
        ${td(r.hotelName, 'wrap')}${td(fmtDate(r.checkIn))}<td class="ref">${esc(r.ref)}</td>
      </tr>`;
      return `<tr>
        <td class="wrap">${esc(r.name)}</td>${td(r.tier)}${td(r.org ? r.org + (r.country ? ' · ' + r.country : '') : r.country, 'wrap')}
        ${td(r.role)}${td(r.events, 'wrap')}${td(r.mobile)}<td>${r.pax}</td>
        ${td(r.depTime)}${td([r.depAirline, r.depFlight].filter(Boolean).join(' '))}${td(r.depTerminal)}
        ${td(r.hotelName, 'wrap')}${td(fmtDate(r.checkOut))}<td class="ref">${esc(r.ref)}</td>
      </tr>`;
    }).join('');
    return { title, count: items.length, cols, rowsHtml, items };
  });
}

/* ---------- Hotel report: one group per hotel / arrangement ---------- */
function hotelReport(rows) {
  const norm = (s) => s.trim().replace(/\s+/g, ' ');
  const groups = groupBy(rows, r => {
    if (!r.accomType) return '￿__undecided';
    if (r.accomType === 'official') return 'A__' + norm(r.hotelName).toLowerCase();
    return 'B__' + norm(r.hotelName).toLowerCase();
  });
  const keys = [...groups.keys()].sort();
  const cols = ['Name','Tier','Org / Country','Role','Event(s)','Mobile','Pax','Room type','Check-in','Check-out','Booking ref','Arrival','Departure','Ref'];
  return keys.map(key => {
    const items = groups.get(key).slice().sort((a, b) => a.name.localeCompare(b.name));
    const title = key === '￿__undecided' ? 'Accommodation not yet decided' : items[0].hotelName + (key.startsWith('B__') ? ' (own arrangement)' : '');
    const rowsHtml = items.map(r => `<tr>
      <td class="wrap">${esc(r.name)}</td>${td(r.tier)}${td(r.org ? r.org + (r.country ? ' · ' + r.country : '') : r.country, 'wrap')}
      ${td(r.role)}${td(r.events, 'wrap')}${td(r.mobile)}<td>${r.pax}</td>
      ${td(r.roomType)}${td(fmtDate(r.checkIn))}${td(fmtDate(r.checkOut))}${td(r.bookingRef)}
      ${td(r.arrDate ? fmtDate(r.arrDate) + (r.arrTime ? ' ' + r.arrTime : '') : '')}
      ${td(r.depDate ? fmtDate(r.depDate) + (r.depTime ? ' ' + r.depTime : '') : '')}
      <td class="ref">${esc(r.ref)}</td>
    </tr>`).join('');
    return { title, count: items.length, cols, rowsHtml, items };
  });
}

/* ---------- Passport report: name, tier, passport details, and a download
   button for the attached copy. Grouped by whether a copy was uploaded so
   outstanding ones are easy to chase -- missing group listed first. ---------- */
function passportReport(rows) {
  const groups = groupBy(rows, r => r.passportCopyKey ? 'A__has' : 'B__missing');
  const keys = [...groups.keys()].sort();
  const cols = ['Name','Tier','Org / Country','Passport number','Type','Place of issue','Issue date','Expiry date','Copy','Ref'];
  return keys.map(key => {
    const items = groups.get(key).slice().sort((a, b) => a.name.localeCompare(b.name));
    const title = key === 'A__has' ? 'Passport copy uploaded' : 'Passport copy missing';
    const rowsHtml = items.map(r => `<tr>
      <td class="wrap">${esc(r.name)}</td>${td(r.tier)}${td(r.org ? r.org + (r.country ? ' · ' + r.country : '') : r.country, 'wrap')}
      ${td(r.passportNumber)}${td(r.passportType)}${td(r.passportPlaceOfIssue, 'wrap')}
      ${td(fmtDate(r.passportIssueDate))}${td(fmtDate(r.passportExpiryDate))}
      ${r.passportCopyKey
        ? `<td><button type="button" class="ghost passportDlBtn" data-key="${esc(r.passportCopyKey)}" data-filename="${esc(r.passportCopyFilename)}" style="height:26px;padding:0 10px;font-size:12px">Download</button></td>`
        : '<td class="muted">Not uploaded</td>'}
      <td class="ref">${esc(r.ref)}</td>
    </tr>`).join('');
    return { title, count: items.length, cols, rowsHtml, items };
  });
}

let lastGroups = [];

function render() {
  const rows = computeRows();
  $('rowCount').textContent = `${rows.length} of ${all.length} shown`;
  const list = $('list');
  if (!rows.length) { list.innerHTML = '<p class="empty">No matching registrations. Load the reports and adjust filters.</p>'; return; }

  lastGroups = activeTab === 'arrival' ? dateReport(rows, 'arrival')
    : activeTab === 'departure' ? dateReport(rows, 'departure')
    : activeTab === 'hotel' ? hotelReport(rows)
    : passportReport(rows);

  list.innerHTML = lastGroups.map(g => `
    <div class="group">
      <div class="ghead"><div class="t">${esc(g.title)}</div><div class="n">${g.count} participant(s)</div></div>
      <div class="tblwrap"><table>
        <thead><tr>${g.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${g.rowsHtml}</tbody>
      </table></div>
    </div>`).join('');
}

/* A genuine .xlsx workbook, not CSV -- a comma delimiter is ambiguous
   with the commas that occur naturally inside hotel addresses and other
   free text, and Excel's locale-dependent list separator makes that
   worse: whoever opens the CSV can end up with a different column for
   the same field on different rows. A real spreadsheet file has no
   delimiter to misread. */
function exportCsv() {
  if (!lastGroups.length) return;
  const cols = lastGroups[0].cols;
  const aoa = [['Group', ...cols]];
  lastGroups.forEach(g => {
    g.items.forEach(r => {
      const vals = activeTab === 'arrival'
        ? [r.name, r.tier, (r.org ? r.org + (r.country ? ' - ' + r.country : '') : r.country), r.role, r.events, r.mobile, r.pax,
           r.arrTime, [r.arrAirline, r.arrFlight].filter(Boolean).join(' '), r.arrTerminal, r.connecting, r.hotelName, fmtDate(r.checkIn), r.ref]
        : activeTab === 'departure'
        ? [r.name, r.tier, (r.org ? r.org + (r.country ? ' - ' + r.country : '') : r.country), r.role, r.events, r.mobile, r.pax,
           r.depTime, [r.depAirline, r.depFlight].filter(Boolean).join(' '), r.depTerminal, r.hotelName, fmtDate(r.checkOut), r.ref]
        : activeTab === 'hotel'
        ? [r.name, r.tier, (r.org ? r.org + (r.country ? ' - ' + r.country : '') : r.country), r.role, r.events, r.mobile, r.pax,
           r.roomType, fmtDate(r.checkIn), fmtDate(r.checkOut), r.bookingRef,
           r.arrDate ? fmtDate(r.arrDate) + (r.arrTime ? ' ' + r.arrTime : '') : '',
           r.depDate ? fmtDate(r.depDate) + (r.depTime ? ' ' + r.depTime : '') : '', r.ref]
        : [r.name, r.tier, (r.org ? r.org + (r.country ? ' - ' + r.country : '') : r.country),
           r.passportNumber, r.passportType, r.passportPlaceOfIssue, fmtDate(r.passportIssueDate), fmtDate(r.passportExpiryDate),
           r.passportCopyKey ? (r.passportCopyFilename || 'Uploaded') : 'Not uploaded', r.ref];
      aoa.push([g.title, ...vals]);
    });
  });
  const header = aoa[0];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = header.map((h, i) => ({ wch: Math.min(40, Math.max(10, h.length, ...aoa.slice(1).map(r => String(r[i] ?? '').length / 1.6))) }));
  const wb = XLSX.utils.book_new();
  const sheetName = activeTab === 'arrival' ? 'By arrival date' : activeTab === 'departure' ? 'By departure date'
    : activeTab === 'hotel' ? 'By hotel' : 'Passport report';
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, `asa-logistics-${activeTab}.xlsx`);
}

async function downloadFileByKey(key, filename) {
  const res = await fetch(CONFIG.apiBase + '/admin/files?key=' + encodeURIComponent(key), { headers: authHeaders() });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || ('HTTP ' + res.status)); }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename || key.split('/').pop();
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('.passportDlBtn'); if (!btn) return;
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '...';
  try {
    await downloadFileByKey(btn.dataset.key, btn.dataset.filename);
  } catch (err) {
    alert('Could not download the passport copy: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
});

document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeTab = tab.dataset.tab;
  render();
}));
$('fEvent').addEventListener('change', render);
$('fTier').addEventListener('change', render);
$('fSearch').addEventListener('input', render);
$('load').addEventListener('click', loadReports);
$('printBtn').addEventListener('click', () => window.print());
$('csvBtn').addEventListener('click', exportCsv);
if (tokenInput.value) loadReports();
</script>
