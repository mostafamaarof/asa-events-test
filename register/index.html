<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Registration — ASA Events Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ASA Events — Unified Registration Form
   Design tokens
   ============================================================ */
:root{
  --ink:#0B2135;
  --ink-soft:#1C3A56;
  --surface:#EEF2F6;
  --sheet:#FFFFFF;
  --rule:#CBD6E0;
  --rule-strong:#93A6B8;
  --muted:#556A7D;
  --brass:#A8842C;
  --brass-tint:#F3EBD8;
  --ok:#1D6B4C;
  --warn:#8A6100;
  --warn-tint:#FBF3DF;
  --err:#A02226;
  --err-tint:#FAECEC;

  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-head:"IBM Plex Serif","IBM Plex Sans Arabic",Georgia,serif;
  --f-num:"IBM Plex Sans",monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
}
html[dir="rtl"]{ --f-head:"IBM Plex Sans Arabic",serif; --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif; }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-body);
  font-size:16px; line-height:1.55;
  color:var(--ink); background:var(--surface);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--f-head); font-weight:600; margin:0; line-height:1.25}
p{margin:0 0 var(--s3)}
a{color:var(--ink-soft)}
:focus-visible{outline:3px solid var(--brass); outline-offset:2px}

/* ---------- Masthead ---------- */
.masthead{background:var(--ink); color:#fff}
.masthead-in{max-width:1140px; margin:0 auto; padding:var(--s4) var(--s5);
  display:flex; align-items:center; gap:var(--s4); flex-wrap:wrap}
.seal{width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  background:var(--brass-tint); display:grid; place-items:center;
  font-family:var(--f-head); font-weight:600; color:var(--ink); font-size:13px; letter-spacing:.02em}
.masthead h1{font-size:19px; color:#fff; font-weight:500}
.masthead .org{font-size:13px; color:#A9BDD0; margin-top:2px}
.masthead-spacer{flex:1 1 auto}
.langbtn{background:transparent;border:1px solid #46617C;color:#fff;
  font-family:var(--f-body);font-size:14px;padding:7px 14px;border-radius:2px;cursor:pointer}
.langbtn:hover{background:#16334D}

/* Document reference strip — mirrors an official file header */
.docref{background:var(--ink-soft); color:#D3E0EC; font-size:13px}
.docref-in{max-width:1140px;margin:0 auto;padding:var(--s2) var(--s5);
  display:flex; gap:var(--s5); flex-wrap:wrap}
.docref b{color:#fff;font-weight:500}

/* ---------- Layout ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:var(--s6) var(--s5) var(--s8);
  display:grid; grid-template-columns:266px minmax(0,1fr); gap:var(--s6); align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:1fr; gap:var(--s4); padding:var(--s4) var(--s3) 120px} }

/* ---------- Ledger (section index, styled as a working-paper register) ---------- */
.ledger{position:sticky; top:var(--s5); background:var(--sheet);
  border:1px solid var(--rule); padding:var(--s4) 0}
.ledger h2{font-size:14px;font-weight:600;padding:0 var(--s4) var(--s3);color:var(--muted)}
.ledger ol{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:26px 1fr 20px;align-items:baseline;
  gap:var(--s2); padding:7px var(--s4); font-size:14px; color:var(--muted);
  border-inline-start:3px solid transparent; cursor:default}
.ledger li .n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;color:var(--rule-strong)}
.ledger li .mk{font-size:13px;text-align:end}
.ledger li[data-state="current"]{color:var(--ink);font-weight:500;
  border-inline-start-color:var(--brass); background:#F8FAFC}
.ledger li[data-state="done"]{color:var(--ink)}
.ledger li[data-state="done"] .mk{color:var(--ok)}
.ledger li[data-state="error"] .mk{color:var(--err)}
.ledger li[data-state="skipped"]{opacity:.45}
.ledger li.clickable{cursor:pointer}
.ledger li.clickable:hover{background:#F4F7FA}
@media (max-width:900px){ .ledger{display:none} }

/* Mobile progress */
.mobile-progress{display:none}
@media (max-width:900px){
  .mobile-progress{display:block;background:var(--sheet);border:1px solid var(--rule);padding:var(--s3) var(--s4)}
  .mobile-progress .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .mobile-progress .bar{height:4px;background:var(--rule);margin-top:var(--s2)}
  .mobile-progress .bar i{display:block;height:100%;background:var(--brass);transition:width .25s}
}

/* ---------- Sheet ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);min-height:420px}
.sheet-head{padding:var(--s5) var(--s6) var(--s4);border-bottom:1px solid var(--rule)}
.sheet-head .kicker{font-size:13px;color:var(--muted);margin-bottom:var(--s2)}
.sheet-head h2{font-size:26px}
.sheet-head p{margin:var(--s3) 0 0;color:var(--muted);max-width:62ch;font-size:15px}
.sheet-body{padding:var(--s5) var(--s6)}
.sheet-foot{padding:var(--s4) var(--s6);border-top:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;background:#FAFCFD}
@media (max-width:900px){
  .sheet-head,.sheet-body{padding-inline:var(--s4)}
  .sheet-foot{padding:var(--s3) var(--s4);position:fixed;inset-inline:0;bottom:0;z-index:20;
    border-top:1px solid var(--rule-strong);background:#fff}
}

/* ---------- Fields ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s5)}
@media (max-width:640px){ .grid{grid-template-columns:1fr} }
.f{display:flex;flex-direction:column;gap:6px}
.f.wide{grid-column:1/-1}
.f label,.f legend{font-size:14px;font-weight:500;color:var(--ink)}
.req{color:var(--brass);font-weight:600;margin-inline-start:3px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],
input[type=number],select,textarea{
  font:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1px solid var(--rule-strong);border-radius:2px;padding:9px 11px;width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
html[dir=rtl] select{background-position:17px 17px,12px 17px;padding-inline-end:11px;padding-inline-start:32px}
input:hover,select:hover,textarea:hover{border-color:var(--ink-soft)}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--err);background:var(--err-tint)}
input:disabled,select:disabled{background:#F2F5F8;color:var(--muted)}
.err{font-size:13px;color:var(--err);font-weight:500}
.warnbox{background:var(--warn-tint);border-inline-start:3px solid var(--warn);
  padding:var(--s3) var(--s4);font-size:14px;color:#5C4200;margin-top:var(--s3)}

fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.choices{display:flex;flex-direction:column;gap:var(--s2);margin-top:2px}
.choices.inline{flex-direction:row;flex-wrap:wrap;gap:var(--s3)}
.choice{display:flex;gap:var(--s3);align-items:flex-start;border:1px solid var(--rule);
  padding:11px var(--s3);cursor:pointer;background:#fff}
.choice:hover{border-color:var(--rule-strong);background:#FAFCFD}
.choice input{margin:3px 0 0;accent-color:var(--ink);flex:0 0 auto}
.choice .t{font-size:15px}
.choice .d{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.choice.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choices.inline .choice{flex:0 1 auto;min-width:150px}

.file{display:flex;align-items:center;gap:var(--s3);border:1px dashed var(--rule-strong);
  padding:var(--s3) var(--s4);background:#FAFCFD;flex-wrap:wrap}
.file .name{font-size:14px;color:var(--muted);flex:1 1 160px;word-break:break-all}
.file .name.set{color:var(--ok);font-weight:500}

/* Repeatable blocks */
.rep{border:1px solid var(--rule);padding:var(--s4);margin-bottom:var(--s4);background:#FBFCFD}
.rep-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)}
.rep-head h3{font-size:16px}

/* ---------- Buttons ---------- */
.btn{font:inherit;font-size:15px;font-weight:500;padding:11px 22px;border-radius:2px;
  cursor:pointer;border:1px solid transparent;background:var(--ink);color:#fff}
.btn:hover{background:var(--ink-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn.ghost:hover{background:#F1F5F8}
.btn.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;padding:4px 2px}
.btn.small{font-size:14px;padding:7px 14px}
.btn.danger{background:none;border:0;color:var(--err);text-decoration:underline;padding:4px 2px}
.foot-spacer{flex:1 1 auto}
.savenote{font-size:13px;color:var(--muted)}

/* ---------- Gate & confirmation ---------- */
.gate{max-width:560px;margin:0 auto}
.gate .sheet-body{padding-block:var(--s6)}
.notice{border:1px solid var(--rule);border-inline-start:3px solid var(--ink);
  padding:var(--s4);background:#F8FAFC;font-size:14.5px;color:var(--ink-soft)}
.notice ul{margin:var(--s2) 0 0;padding-inline-start:18px}
.notice li{margin-bottom:4px}
.stamp{border:2px solid var(--brass);color:var(--brass);display:inline-block;
  padding:6px 14px;font-family:var(--f-head);font-size:15px;transform:rotate(-1.5deg)}

/* ---------- Review ---------- */
.review-sec{border-top:1px solid var(--rule);padding:var(--s4) 0}
.review-sec:first-child{border-top:0;padding-top:0}
.review-sec .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s3)}
.review-sec h3{font-size:16px}
.dl{display:grid;grid-template-columns:minmax(140px,34%) 1fr;gap:6px var(--s4);font-size:14.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;word-break:break-word}
.dl dd.empty{color:var(--rule-strong)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .sheet-body[data-anim]{animation:step .22s ease-out}
  @keyframes step{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <div class="seal" aria-hidden="true">ASA</div>
    <div>
      <h1 id="ev-title">SAI Egypt Events</h1>
      <div class="org" id="ev-org">Accountability State Authority — Arab Republic of Egypt</div>
    </div>
    <div class="masthead-spacer"></div>
    <button class="langbtn" id="langToggle" type="button">العربية</button>
  </div>
</header>
<div class="docref">
  <div class="docref-in">
    <span id="dr-event"></span>
    <span id="dr-dates"></span>
    <span id="dr-status"></span>
  </div>
</div>

<main class="wrap" id="wrap">
  <nav class="ledger" id="ledger" aria-label="Sections"><h2 id="ledger-h">Sections</h2><ol id="ledger-list"></ol></nav>
  <div>
    <div class="mobile-progress" id="mprog">
      <div class="row"><span id="mprog-name"></span><span id="mprog-count"></span></div>
      <div class="bar"><i id="mprog-bar" style="width:0%"></i></div>
    </div>
    <section class="sheet" id="sheet" aria-live="polite">
      <div class="sheet-head">
        <div class="kicker" id="s-kicker"></div>
        <h2 id="s-title"></h2>
        <p id="s-desc"></p>
      </div>
      <div class="sheet-body" id="s-body"></div>
      <div class="sheet-foot" id="s-foot"></div>
    </section>
  </div>
</main>

<script src="registration.js?v=20260909a"></script>
</body>
</html>
